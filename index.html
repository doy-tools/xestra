<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOYZ CLONER V1.7 FIX</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,Arial;
}
body{
  background:#f2f2f7;
  color:#000;
}
.page{
  display:none;
}
.page.active{
  display:block;
  animation:fadeUp .5s ease both;
}
@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
@keyframes popIn{
  0%{
    opacity:0;
    transform:scale(.92);
  }
  100%{
    opacity:1;
    transform:scale(1);
  }
}
@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-6px);
  }
}
.topbar{
  max-width:520px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  font-weight:900;
  font-size:19px;
  animation:float 3s infinite;
}
.logo b{
  color:#007aff;
}
.pill{
  background:#e5e5ea;
  padding:6px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  color:#007aff;
}
.wrap{
  max-width:520px;
  margin:0 auto;
  padding:16px 14px 30px;
}
.card{
  background:#fff;
  border-radius:24px;
  padding:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  animation:popIn .5s ease both;
}
h1{
  font-size:23px;
  font-weight:900;
}
h1 span{
  color:#007aff;
}
.sub{
  color:#8a8a8e;
  font-size:13px;
  margin:8px 0 14px;
}
.input-row{
  position:relative;
  margin-bottom:12px;
}
.input-row input{
  width:100%;
  padding:15px 14px 15px 42px;
  border-radius:14px;
  background:#f2f2f7;
  border:none;
  outline:none;
  font-size:14px;
}
.input-row input:focus{
  outline:2px solid #007aff;
}
.input-row .ic{
  position:absolute;
  left:13px;
  top:50%;
  transform:translateY(-50%);
}
.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:14px;
  background:#007aff;
  color:#fff;
  font-weight:800;
  cursor:pointer;
}
.btn:active{
  transform:scale(.97);
}
.btn-ghost{
  background:#f2f2f7;
  color:#000;
  margin-top:10px;
}
.btn-main{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:#007aff;
  color:#fff;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  margin-top:12px;
}
textarea{
  width:100%;
  height:420px;
  background:#1c1c1e;
  color:#a6e3ff;
  border-radius:16px;
  padding:14px;
  font-family:monospace;
  font-size:11px;
  line-height:1.6;
  outline:none;
  border:none;
}
.row{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.btn2{
  flex:1;
  padding:13px;
  border:none;
  border-radius:12px;
  font-weight:800;
  cursor:pointer;
}
.toast{
  position:fixed;
  bottom:26px;
  left:50%;
  transform:translateX(-50%) translateY(80px);
  background:#000;
  color:#fff;
  padding:12px 20px;
  border-radius:20px;
  font-weight:700;
  font-size:13px;
  z-index:9999;
  transition:.35s;
}
.toast.show{
  transform:translateX(-50%) translateY(0);
}
</style>
</head>
<body>

<div id="page-login" class="page active">
  <div class="topbar">
    <div class="logo">DOYZ <b>CLONER</b></div>
    <div class="pill">V1.7 • iOS + FIX</div>
  </div>
  <div class="wrap">
    <div class="card" style="text-align:center">
      <div style="font-size:48px">📱</div>
      <h1 style="margin-top:10px">
        Clone Web<br><span>Style iOS</span>
      </h1>
      <p class="sub">Animasi di semua halaman<br>Admin: . / .</p>
      <div class="input-row">
        <span class="ic">👤</span>
        <input id="loginUser" placeholder="Username">
      </div>
      <div class="input-row">
        <span class="ic">🔒</span>
        <input id="loginPass" type="password" placeholder="Password">
      </div>
      <button id="loginBtn" type="button" class="btn">MASUK →</button>
      <button id="toRegBtn" type="button" class="btn btn-ghost">
        Buat Akun Baru
      </button>
      <div id="guestLink" style="color:#007aff;margin-top:12px;cursor:pointer">
        Lanjut sebagai Guest →
      </div>
    </div>
  </div>
</div>

<div id="page-register" class="page">
  <div class="topbar">
    <div class="logo">DOYZ <b>CLONER</b></div>
    <div class="pill">iOS</div>
  </div>
  <div class="wrap">
    <div class="card" style="text-align:center">
      <div style="font-size:44px">✨</div>
      <h1>Buat Akun</h1>
      <div class="input-row" style="margin-top:14px">
        <span class="ic">😎</span>
        <input id="regNama" placeholder="Nama Lu">
      </div>
      <div class="input-row">
        <span class="ic">👤</span>
        <input id="regUser" placeholder="Username">
      </div>
      <div class="input-row">
        <span class="ic">🔒</span>
        <input id="regPass" type="password" placeholder="Password">
      </div>
      <button id="regBtn" type="button" class="btn">DAFTAR & MASUK</button>
      <div id="toLoginLink" style="color:#007aff;margin-top:12px;cursor:pointer">
        Udah punya akun? Login
      </div>
    </div>
  </div>
</div>

<div id="page-home" class="page">
  <div class="topbar">
    <div class="logo">DOYZ <b>CLONER</b></div>
    <div class="pill" id="userBadge">GUEST</div>
  </div>
  <div class="wrap">
    <div class="card">
      <h1>Wayground <span>iOS Clone</span></h1>
      <p class="sub">Halo <b id="haloNama">Pung</b></p>
      <div id="adminBox" style="display:none;background:#007aff;color:#fff;padding:12px;border-radius:14px">
        <b>👑 ADMIN AKTIF • . / .</b>
      </div>
      <div class="input-row" style="margin-top:14px">
        <span class="ic">🔗</span>
        <input id="link" value="https://wayground.com/join">
      </div>
      <button id="btnDl" type="button" class="btn-main">⬇ AMBIL KODE SEKARANG</button>
      <div id="loading" style="display:none;text-align:center;padding:14px">Lagi nyoba...</div>
      <div id="done"></div>
      <textarea id="editor" placeholder="Kode DOCTYPE muncul disini..."></textarea>
      <div id="previewBox" style="display:none;height:420px">
        <iframe id="previewFrame" style="width:100%;height:100%;border:none"></iframe>
      </div>
      <div class="row">
        <button id="btnPreview" type="button" class="btn2" style="background:#000;color:#fff">PREVIEW</button>
        <button id="btnDownload" type="button" class="btn2" style="background:#34c759;color:#fff">DOWNLOAD</button>
      </div>
      <div class="row">
        <button id="btnCopy" type="button" class="btn2" style="background:#f2f2f7">COPY</button>
        <button id="btnClear" type="button" class="btn2" style="background:#ff3b30;color:#fff">CLEAR</button>
      </div>
      <button id="btnReloadWay" type="button" class="btn2" style="background:#007aff;color:#fff;width:100%;margin-top:10px">LOAD WAYGROUND iOS LAGI</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="btnHome" type="button" class="btn2" style="background:#fff">Home</button>
      <button id="btnLogout" type="button" class="btn2" style="background:#fff">Logout</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Berhasil</div>

<script>
function toast(t){
  var e = document.getElementById('toast');
  e.innerText = t;
  e.classList.add('show');
  setTimeout(function(){ e.classList.remove('show'); }, 3000);
}
function showPage(id){
  var pages = document.querySelectorAll('.page');
  for(var i=0;i<pages.length;i++){
    pages[i].classList.remove('active');
  }
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}
function masuk(n, admin){
  document.getElementById('haloNama').innerText = n;
  document.getElementById('userBadge').innerText = n;
  var box = document.getElementById('adminBox');
  box.style.display = admin ? 'block' : 'none';
  showPage('page-home');
  loadWayground();
  toast('Welcome ' + n);
}
function doLogin(){
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value.trim();
  if(u === '.' && p === '.'){
    masuk('Admin DOYZ', true);
    return;
  }
  masuk(u || 'Pung', false);
}
function doReg(){
  var n = document.getElementById('regNama').value.trim() || 'Pung';
  masuk(n, false);
}
function loadWayground(){
  var p = [];
  p.push('<!DOCTYPE html>');
  p.push('<html lang="en">');
  p.push('<head>');
  p.push('<meta charset="UTF-8">');
  p.push('<meta name="viewport" content="width=device-width, initial-scale=1.0">');
  p.push('<title>For Students - Enter Your Code | Wayground</title>');
  p.push('<style>');
  p.push('body{background:#f2f2f7;font-family:-apple-system,Arial;margin:0}');
  p.push('.top{background:#fff;padding:16px;display:flex;justify-content:space-between}');
  p.push('.logo{font-weight:900;color:#007aff;font-size:24px}');
  p.push('.card{background:#fff;border-radius:28px;padding:28px;margin:20px}');
  p.push('.card h1{font-size:30px;font-weight:900}');
  p.push('.card h1 span{color:#007aff}');
  p.push('.code-box{display:flex;gap:10px}');
  p.push('.code-box input{flex:1;padding:16px;background:#f2f2f7;border:none;border-radius:16px;text-align:center;font-size:18px}');
  p.push('.join-btn{padding:16px 22px;background:#007aff;color:#fff;border:none;border-radius:16px;font-weight:800}');
  p.push('@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}');
  p.push('.card{animation:fadeUp .5s ease both}');
  p.push('.avatar{width:120px;height:120px;background:#fff;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center}');
  p.push('.avatar img{width:90px}');
  p.push('.links{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px}');
  p.push('.links a{display:block;color:#666;text-decoration:none;font-size:13px;margin-bottom:6px}');
  p.push('</style>');
  p.push('</head>');
  p.push('<body>');
  p.push('<div class="top"><div class="logo">wayground</div><div>Log in</div></div>');
  p.push('<div class="card">');
  p.push('<h1>For Students<br><span>Enter Your Code</span></h1>');
  p.push('<p>Join a game with a code from your teacher.</p>');
  p.push('<div class="code-box">');
  p.push('<input id="codeInput" placeholder="123 456">');
  p.push('<button class="join-btn" onclick="joinGame()">JOIN</button>');
  p.push('</div>');
  p.push('<p style="font-size:12px;margin-top:10px">Example: 123456</p>');
  p.push('<div style="background:#f0f7ff;border-radius:18px;padding:14px;margin-top:14px">');
  p.push('<b>Back to School 2026</b><br>');
  p.push('<img src="https://cf.quizizz.com/Playground/bts-sticker.jpg" style="width:100%;border-radius:16px;margin-top:8px">');
  p.push('</div>');
  p.push('<div class="avatar" style="margin-top:16px"><img src="https://wayground.com/_media/avatar-assets/topwear/br_brazilTee3.svg"></div>');
  p.push('</div>');
  p.push('<div class="links">');
  p.push('<div><h4>Wayground</h4><a href="https://wayground.com/home/schools-and-districts">Wayground For School</a><a href="https://wayground.com/join">Join a Quiz</a><a href="https://wayground.com/home/plans">Plans</a></div>');
  p.push('<div><h4>Subjects</h4><a href="https://wayground.com/en/math-worksheets">Math</a><a href="https://wayground.com/en/science-worksheets">Science</a><a href="https://wayground.com/en/worksheets">All Worksheets</a></div>');
  p.push('</div>');
  p.push('<scr' + 'ipt>');
  p.push('function joinGame(){var c=document.getElementById("codeInput").value;alert("Joining "+c)}');
  p.push('</scr' + 'ipt>');
  p.push('</body>');
  p.push('</html>');
  var code = p.join('\n');
  document.getElementById('editor').value = code;
  toast('Wayground iOS ke-load!');
}
document.addEventListener('DOMContentLoaded', function(){
  document.getElementById('loginBtn').addEventListener('click', doLogin);
  document.getElementById('toRegBtn').addEventListener('click', function(){ showPage('page-register'); });
  document.getElementById('guestLink').addEventListener('click', function(){ masuk('Guest', false); });
  document.getElementById('regBtn').addEventListener('click', doReg);
  document.getElementById('toLoginLink').addEventListener('click', function(){ showPage('page-login'); });
  document.getElementById('btnDl').addEventListener('click', loadWayground);
  document.getElementById('btnReloadWay').addEventListener('click', loadWayground);
  document.getElementById('btnHome').addEventListener('click', function(){ showPage('page-home'); });
  document.getElementById('btnLogout').addEventListener('click', function(){ showPage('page-login'); });
  document.getElementById('btnPreview').addEventListener('click', function(){
    var code = document.getElementById('editor').value;
    document.getElementById('previewBox').style.display = 'block';
    document.getElementById('previewFrame').srcdoc = code;
    toast('Preview jalan!');
  });
  document.getElementById('btnDownload').addEventListener('click', function(){
    var code = document.getElementById('editor').value;
    var blob = new Blob([code], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'wayground-ios.html';
    a.click();
    toast('Ke download!');
  });
  document.getElementById('btnCopy').addEventListener('click', function(){
    var ed = document.getElementById('editor');
    ed.select();
    document.execCommand('copy');
    toast('Ke copy!');
  });
  document.getElementById('btnClear').addEventListener('click', function(){
    document.getElementById('editor').value = '';
  });
  document.getElementById('loginPass').addEventListener('keypress', function(e){
    if(e.key === 'Enter') doLogin();
  });
});
</script>
</body>
  </html>
